# Builds a release APK. Download from: Repo → Actions → this workflow run → Artifacts.
#
# Required for a successful build (Firebase Android):
#   Repository secret: GOOGLE_SERVICES_JSON = full contents of your android/app/google-services.json
#
# Optional (bake Gemini key into the APK — demo only, not for production):
#   Repository secret: GEMINI_API_KEY
#
# Optional (use your NLTK chatbot server instead of Gemini):
#   Repository secret: CHATBOT_WS_URL  e.g. wss://your-server/ws

name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Write google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -e
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Add repo secret GOOGLE_SERVICES_JSON (paste full google-services.json from Firebase Console)."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Dependencies
        run: flutter pub get

      - name: Build APK (release)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CHATBOT_WS_URL: ${{ secrets.CHATBOT_WS_URL }}
          CHATBOT_HTTP_BASE: ${{ secrets.CHATBOT_HTTP_BASE }}
        run: |
          set -e
          DDEF=()
          if [ -n "$GEMINI_API_KEY" ]; then DDEF+=(--dart-define=GEMINI_API_KEY="$GEMINI_API_KEY"); fi
          if [ -n "$CHATBOT_WS_URL" ]; then DDEF+=(--dart-define=CHATBOT_WS_URL="$CHATBOT_WS_URL"); fi
          if [ -n "$CHATBOT_HTTP_BASE" ]; then DDEF+=(--dart-define=CHATBOT_HTTP_BASE="$CHATBOT_HTTP_BASE"); fi
          flutter build apk --release "${DDEF[@]}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: youmatter-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
